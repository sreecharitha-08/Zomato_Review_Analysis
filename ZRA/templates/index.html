<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Review Analysis Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin: 20px;
            padding: 30px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: rgba(102, 126, 234, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: rgba(118, 75, 162, 0.05);
        }
        
        .upload-area.dragover {
            border-color: #764ba2;
            background: rgba(118, 75, 162, 0.1);
        }
        
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .summary-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin: 10px 0;
        }
        
        .summary-card h5 {
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .metric {
            text-align: center;
            padding: 15px;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .metric-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
            color: #667eea;
        }
        
        .complaint-item {
            background: #fff5f5;
            border-left: 4px solid #e53e3e;
            padding: 15px;
            margin: 10px 0;
            border-radius: 0 10px 10px 0;
        }
        
        .complaint-dish {
            font-weight: bold;
            color: #e53e3e;
            font-size: 1.1rem;
        }
        
        .complaint-rate {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
        
        .complaint-examples {
            margin-top: 10px;
            font-style: italic;
            color: #555;
        }
        
        .suggestion-item {
            background: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 20px;
            margin: 15px 0;
            border-radius: 0 10px 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .suggestion-header {
            font-weight: bold;
            color: #007bff;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        
        .suggestion-details {
            margin: 8px 0;
            color: #666;
        }
        
        .suggestion-recommendation {
            margin-top: 15px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 5px;
            font-style: italic;
            color: #1976d2;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .chart-title {
            color: #333;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .success-message {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-container">
            <div class="text-center mb-4">
                <h1 class="display-4 text-primary">
                    <i class="fas fa-chart-line"></i>
                    Zomato Review Analysis Dashboard
                </h1>
                <p class="lead text-muted">Upload your review data to get comprehensive insights</p>
            </div>
            
            <!-- Upload Section -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-content">
                    <i class="fas fa-cloud-upload-alt fa-3x text-primary mb-3"></i>
                    <h4>Upload Your Review Data</h4>
                    <p class="text-muted">Drag and drop your CSV file here or click to browse</p>
                    <p class="small text-muted">Required columns: "Review" and "Liked" (1 for positive, 0 for negative)</p>
                    <input type="file" id="fileInput" accept=".csv" style="display: none;">
                    <button class="btn btn-primary mt-3" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-file-upload"></i> Choose File
                    </button>
                </div>
            </div>
            
            <!-- Loading Section -->
            <div class="loading" id="loadingSection">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Processing your data and generating insights...</p>
            </div>
            
            <!-- Error/Success Messages -->
            <div id="messageArea"></div>
            
            <!-- Results Section -->
            <div id="resultsSection" style="display: none;">
                <!-- Summary Cards -->
                <div class="row" id="summaryCards"></div>
                
                <!-- Charts -->
                <div id="chartsContainer"></div>
                
                <!-- Complaint Analysis -->
                <div id="complaintAnalysis"></div>
                
                <!-- AI Suggestions -->
                <div id="aiSuggestions"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loadingSection = document.getElementById('loadingSection');
        const resultsSection = document.getElementById('resultsSection');
        const messageArea = document.getElementById('messageArea');
            const summaryCards = document.getElementById('summaryCards');
            const chartsContainer = document.getElementById('chartsContainer');
            const complaintAnalysis = document.getElementById('complaintAnalysis');
            const aiSuggestions = document.getElementById('aiSuggestions');

        // Drag and drop functionality
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.endsWith('.csv')) {
                showMessage('Please upload a CSV file.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            // Show loading
            uploadArea.style.display = 'none';
            loadingSection.style.display = 'block';
            resultsSection.style.display = 'none';
            messageArea.innerHTML = '';

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loadingSection.style.display = 'none';
                
                if (data.success) {
                    showResults(data);
                    showMessage('Analysis completed successfully!', 'success');
                } else {
                    showMessage(data.error || 'An error occurred while processing the file.', 'error');
                    uploadArea.style.display = 'block';
                }
            })
            .catch(error => {
                loadingSection.style.display = 'none';
                showMessage('Network error: ' + error.message, 'error');
                uploadArea.style.display = 'block';
            });
        }

        function showMessage(message, type) {
            const alertClass = type === 'error' ? 'error-message' : 'success-message';
            messageArea.innerHTML = `<div class="${alertClass}">${message}</div>`;
        }

        function showResults(data) {
            resultsSection.style.display = 'block';
            uploadArea.style.display = 'none';

            // Show summary cards
            const summary = data.summary;
            summaryCards.innerHTML = `
                <div class="col-md-3">
                    <div class="summary-card">
                        <h5><i class="fas fa-comments"></i> Total Reviews</h5>
                        <div class="metric-value">${summary.total_reviews}</div>
                        <div class="metric-label">Reviews Analyzed</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="summary-card">
                        <h5><i class="fas fa-thumbs-up"></i> Positive</h5>
                        <div class="metric-value">${summary.positive_reviews}</div>
                        <div class="metric-label">${((summary.positive_reviews / summary.total_reviews) * 100).toFixed(1)}%</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="summary-card">
                        <h5><i class="fas fa-thumbs-down"></i> Negative</h5>
                        <div class="metric-value">${summary.negative_reviews}</div>
                        <div class="metric-label">${((summary.negative_reviews / summary.total_reviews) * 100).toFixed(1)}%</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="summary-card">
                        <h5><i class="fas fa-text-width"></i> Avg Length</h5>
                        <div class="metric-value">${summary.avg_review_length.toFixed(0)}</div>
                        <div class="metric-label">Characters</div>
                    </div>
                </div>
            `;

            // Show charts
            chartsContainer.innerHTML = '';
            const chartTitles = {
                'sentiment_dist': 'Distribution of Positive/Negative Reviews',
                'review_lengths': 'Distribution of Review Lengths',
                'aspect_frequency': 'Frequency of Aspects Mentioned',
                'aspect_sentiment': 'Aspect Sentiment Percentages',
                'benchmarking': 'Aspect Sentiment Benchmarking',
                'dish_complaints': 'Dish Complaint Analysis'
            };

            Object.entries(data.charts).forEach(([key, chartData]) => {
                const chartDiv = document.createElement('div');
                chartDiv.className = 'chart-container';
                chartDiv.innerHTML = `
                    <h4 class="chart-title">${chartTitles[key] || key}</h4>
                    <img src="data:image/png;base64,${chartData}" class="img-fluid" alt="${chartTitles[key]}">
                `;
                chartsContainer.appendChild(chartDiv);
            });

            // Show complaint analysis
            if (summary.top_complaints && summary.top_complaints.length > 0) {
                complaintAnalysis.innerHTML = `
                    <div class="chart-container">
                        <h4 class="chart-title"><i class="fas fa-exclamation-triangle"></i> Top Dishes Needing Improvement</h4>
                        ${summary.top_complaints.map((complaint, index) => `
                            <div class="complaint-item">
                                <div class="complaint-dish">#${index + 1}: ${complaint.dish.toUpperCase()}</div>
                                <div class="complaint-rate">
                                    Complaint rate: ${complaint.complaint_pct.toFixed(1)}% (${complaint.complaints}/${complaint.total_mentions} reviews)
                                </div>
                                <div class="complaint-examples">
                                    <strong>Sample complaints:</strong><br>
                                    ${complaint.examples.map(example => `• "${example}"`).join('<br>')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Show AI suggestions
            if (summary.ai_suggestions && summary.ai_suggestions.length > 0) {
                aiSuggestions.innerHTML = `
                    <div class="chart-container">
                        <h4 class="chart-title"><i class="fas fa-robot"></i> AI-Generated Suggestions</h4>
                        ${summary.ai_suggestions.map((suggestion, index) => `
                            <div class="suggestion-item">
                                <div class="suggestion-header">Suggestion #${index + 1}</div>
                                <div class="suggestion-details">
                                    <strong>Aspect:</strong> ${suggestion.aspect}<br>
                                    <strong>Your Score:</strong> ${suggestion.your_score.toFixed(0)}%<br>
                                    <strong>Best Competitor:</strong> ${suggestion.best_competitor} (${suggestion.best_score.toFixed(0)}%)
                                </div>
                                <div class="suggestion-recommendation">
                                    <strong>Recommendation:</strong> ${suggestion.recommendation}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Add reset button
            const resetButton = document.createElement('div');
            resetButton.className = 'text-center mt-4';
            resetButton.innerHTML = `
                <button class="btn btn-primary" onclick="resetAnalysis()">
                    <i class="fas fa-upload"></i> Upload Another File
                </button>
            `;
            resultsSection.appendChild(resetButton);
        }

        function resetAnalysis() {
            resultsSection.style.display = 'none';
            uploadArea.style.display = 'block';
            messageArea.innerHTML = '';
            fileInput.value = '';
        }
    </script>
</body>
</html>
